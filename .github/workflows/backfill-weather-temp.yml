name: Temp Weather Backfill (2026-05-21..2026-05-23)

# 一時的なバックフィル用ワークフロー。
# このファイルのpush（または手動実行）で1回だけ実行し、完了後に削除する想定。
on:
  push:
    branches:
      - claude/ihealth-relay-migration-VF1GQ
    paths:
      - '.github/workflows/backfill-weather-temp.yml'
  workflow_dispatch:
    inputs:
      start_date:
        description: '開始日 (YYYY-MM-DD)'
        required: false
        default: '2026-05-21'
        type: string
      end_date:
        description: '終了日 (YYYY-MM-DD)'
        required: false
        default: '2026-05-23'
        type: string

jobs:
  backfill-weather:
    runs-on: ubuntu-latest

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v5

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 依存関係のインストール
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 天気データのバックフィル
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
          DATABASE_ID: ${{ secrets.DATABASE_ID }}
        run: |
          START_DATE="${{ github.event.inputs.start_date || '2026-05-21' }}"
          END_DATE="${{ github.event.inputs.end_date || '2026-05-23' }}"
          echo "バックフィル: $START_DATE 〜 $END_DATE"
          cd src/weather
          python update_weather.py "$START_DATE" "$END_DATE" --yes
